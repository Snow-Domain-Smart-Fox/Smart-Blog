<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>文章归档 - zym2013 的个人主页</title>
	<link rel="stylesheet" href="https://cdn.jsdmirror.cn/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
	<link rel="stylesheet"
		href="https://cdn.jsdmirror.cn/gh/zym2013/amazing-luogu-international@main/style/markdown.css">
	<link rel="preload" href="https://cdn.jsdmirror.cn/npm/lxgw-wenkai-screen-webfont@1.7.0/style.min.css" as="style"
		crossorigin="anonymous" onload="this.rel='stylesheet'">
	<link rel="stylesheet" href="https://cdn.jsdmirror.cn/npm/katex@0.16.9/dist/katex.min.css">
	<style>
		/* ===== 继承主站样式变量 ===== */
		:root {
			--primary-color: #6366f1;
			--primary-light: #818cf8;
			--bg-color: #f3f4f6;
			--card-bg: #ffffff;
			--text-main: #1f2937;
			--text-sub: #6b7280;
			--footer-bg: #ffffff;
			--border-color: rgba(99, 102, 241, 0.1);
			--font-kai: "LXGW Wenkai Screen", "Kaiti SC", "STKaiti", "Noto Serif SC", serif;
			--shadow-color: rgba(0, 0, 0, 0.05);
			--shadow-hover: rgba(99, 102, 241, 0.15)
		}

		[data-theme="dark"] {
			--primary-color: #818cf8;
			--primary-light: #a5b4fc;
			--bg-color: #111827;
			--card-bg: #1f2937;
			--text-main: #f9fafb;
			--text-sub: #9ca3af;
			--footer-bg: #1f2937;
			--border-color: rgba(129, 140, 248, 0.1);
			--shadow-color: rgba(0, 0, 0, 0.2);
			--shadow-hover: rgba(129, 140, 248, 0.2)
		}

		* {
			margin: 0;
			padding: 0;
			-webkit-tap-highlight-color: transparent
		}

		body {
			font-family: var(--font-kai), sans-serif;
			background-color: var(--bg-color);
			color: var(--text-main);
			line-height: 1.6;
			overflow-x: hidden;
			transition: background-color 0.3s ease, color 0.3s ease;
			display: flex;
			flex-direction: column;
			min-height: 100vh
		}

		/* ===== 头部导航（与主页一致）===== */
		header {
			background-color: var(--card-bg);
			height: 60px;
			display: flex;
			align-items: center;
			padding: 0 5%;
			box-shadow: 0 2px 4px var(--shadow-color);
			position: sticky;
			top: 0;
			z-index: 100;
			animation: slideDown 0.8s ease-out;
			transition: background-color 0.3s ease, box-shadow 0.3s ease
		}

		header .logo {
			font-weight: bold;
			font-size: 1.2rem;
			color: var(--primary-color);
			letter-spacing: 1px;
			text-decoration: none
		}

		.header-nav {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-left: auto;
			margin-right: 5%
		}

		.nav-item {
			position: relative;
			cursor: pointer
		}

		.nav-link {
			font-size: 1rem;
			color: var(--text-main);
			font-weight: 500;
			padding: 8px 12px;
			transition: color 0.3s ease;
			display: flex;
			align-items: center;
			gap: 5px;
			text-decoration: none
		}

		.nav-link:hover {
			color: var(--primary-color)
		}

		.nav-link i {
			font-size: 0.7rem;
			transition: transform 0.3s ease
		}

		.nav-item:hover .nav-link i {
			transform: rotate(180deg)
		}

		.dropdown-menu {
			position: absolute;
			top: 100%;
			left: 50%;
			transform: translateX(-50%) translateY(10px);
			background: var(--card-bg);
			border-radius: 8px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
			padding: 8px 0;
			min-width: 150px;
			opacity: 0;
			visibility: hidden;
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			border: 1px solid var(--border-color);
			z-index: 1000
		}

		.nav-item:hover .dropdown-menu {
			opacity: 1;
			visibility: visible;
			transform: translateX(-50%) translateY(0)
		}

		.dropdown-menu a {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 10px 20px;
			color: var(--text-main);
			text-decoration: none;
			font-size: 0.9rem;
			transition: all 0.2s ease
		}

		.dropdown-menu a:hover {
			background: rgba(99, 102, 241, 0.1);
			color: var(--primary-color);
			padding-left: 25px
		}

		.theme-toggle-btn {
			background: none;
			border: none;
			cursor: pointer;
			color: var(--text-main);
			font-size: 1.2rem;
			padding: 8px;
			border-radius: 50%;
			transition: all 0.3s ease;
			display: flex;
			align-items: center;
			justify-content: center;
			margin-left: 10px
		}

		.theme-toggle-btn:hover {
			background-color: rgba(99, 102, 241, 0.1);
			color: var(--primary-color);
			transform: rotate(15deg)
		}

		/* ===== 归档页面主体 ===== */
		.container {
			max-width: 1200px;
			margin: 20px auto;
			display: flex;
			gap: 20px;
			padding: 0 20px;
			flex: 1;
			width: 100%;
			box-sizing: border-box
		}

		.sidebar {
			flex: 1;
			display: flex;
			flex-direction: column;
			gap: 20px
		}

		.main-content {
			flex: 3;
			min-width: 0
		}

		.card {
			background: var(--card-bg);
			border-radius: 12px;
			padding: 20px;
			box-shadow: 0 4px 6px var(--shadow-color);
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			border: 1px solid var(--border-color);
			opacity: 0;
			animation: fadeInUp 0.8s ease-out forwards
		}

		.card:hover {
			box-shadow: 0 10px 20px var(--shadow-hover);
			transform: translateY(-5px);
			border-color: var(--primary-light)
		}

		/* ===== 归档标题区 ===== */
		.archive-header {
			background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
			border-radius: 12px;
			padding: 30px 25px;
			margin-bottom: 25px;
			box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
			opacity: 0;
			animation: fadeInUp 0.8s ease-out forwards;
			text-align: center;
			color: #fff
		}

		.archive-header h1 {
			font-size: 2rem;
			margin-bottom: 10px;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 12px;
			margin-top: 0px;
		}

		.archive-header h1 i {
			/* animation: floatIcon 3s ease-in-out infinite */
		}

		.greeting-text {
			font-size: 0.9rem;
			color: var(--primary-color);
			font-weight: bold;
			margin-left: 15px;
			padding: 6px 12px;
			background: rgba(99, 102, 241, 0.1);
			border-radius: 20px;
			display: inline-block;
			animation: fadeInUp 0.8s ease-out
		}

		.greeting-text i {
			margin-right: 5px;
			font-size: 0.8rem
		}

		#jinrishici-text {
			font-style: italic;
			border-right: 2px solid var(--primary-color);
			padding-right: 2px;
			animation: blinkCursor 0.8s infinite
		}

		@keyframes blinkCursor {

			0%,
			100% {
				border-color: var(--primary-color)
			}

			50% {
				border-color: transparent
			}
		}

		@media(max-width:768px) {
			.footer-line-2 {
				gap: 8px
			}
		}

		.archive-stats {
			display: flex;
			justify-content: center;
			gap: 30px;
			flex-wrap: wrap;
			font-size: 0.95rem;
			opacity: 0.9
		}

		.archive-stats span {
			display: flex;
			align-items: center;
			gap: 8px
		}

		.archive-stats i {
			font-size: 1.1rem
		}

		/* ===== 归档时间线 ===== */
		.archive-timeline {
			position: relative;
			padding-left: 20px
		}

		.archive-timeline::before {
			content: '';
			position: absolute;
			left: 0;
			top: 0;
			bottom: 0;
			width: 3px;
			background: linear-gradient(to bottom, var(--primary-color), var(--primary-light), transparent);
			border-radius: 3px
		}

		.year-section {
			margin-bottom: 35px;
			position: relative;
			opacity: 0;
			animation: fadeInRight 0.6s ease-out forwards
		}

		.year-section:nth-child(1) {
			animation-delay: 0.1s
		}

		.year-section:nth-child(2) {
			animation-delay: 0.2s
		}

		.year-section:nth-child(3) {
			animation-delay: 0.3s
		}

		.year-section:nth-child(4) {
			animation-delay: 0.4s
		}

		.year-section:nth-child(5) {
			animation-delay: 0.5s
		}

		.year-marker {
			display: flex;
			align-items: center;
			gap: 12px;
			margin-bottom: 20px;
			position: relative
		}

		.year-marker::before {
			content: '';
			position: absolute;
			left: -28px;
			top: 50%;
			transform: translateY(-50%);
			width: 14px;
			height: 14px;
			background: var(--primary-color);
			border-radius: 50%;
			border: 3px solid var(--card-bg);
			box-shadow: 0 0 0 2px var(--primary-color)
		}

		.year-title {
			font-size: 1.5rem;
			font-weight: bold;
			color: var(--primary-color);
			display: flex;
			align-items: center;
			gap: 8px
		}

		.year-title i {
			font-size: 1.2rem
		}

		.year-count {
			background: rgba(99, 102, 241, 0.1);
			color: var(--primary-color);
			padding: 4px 12px;
			border-radius: 20px;
			font-size: 0.85rem;
			font-weight: 500
		}

		.month-group {
			margin-bottom: 25px;
			padding-left: 15px
		}

		.month-header {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 15px;
			font-size: 1.1rem;
			color: var(--text-main);
			font-weight: 600
		}

		.month-header i {
			color: var(--primary-light);
			font-size: 1rem
		}

		.month-divider {
			flex: 1;
			height: 1px;
			background: linear-gradient(to right, var(--border-color), transparent)
		}

		.article-list {
			display: flex;
			flex-direction: column;
			gap: 12px
		}

		.article-item {
			background: var(--card-bg);
			padding: 16px 20px;
			border-radius: 8px;
			display: flex;
			flex-direction: column;
			transition: all 0.3s ease;
			cursor: pointer;
			position: relative;
			overflow: visible;
			border: 1px solid var(--border-color);
			opacity: 0;
			animation: fadeInRight 0.5s ease-out forwards
		}

		.article-item:hover {
			border-color: var(--primary-color);
			box-shadow: 0 5px 15px var(--shadow-hover);
			transform: translateX(5px)
		}

		.article-item::before {
			content: '';
			position: absolute;
			left: 0;
			top: 50%;
			transform: translateY(-50%);
			width: 4px;
			height: 0;
			background: var(--primary-color);
			border-radius: 0 4px 4px 0;
			transition: height 0.3s ease
		}

		.article-item:hover::before {
			height: 60%
		}

		.article-title {
			font-size: 1.05rem;
			font-weight: 600;
			color: var(--text-main);
			line-height: 1.4;
			margin-bottom: 8px
		}

		.article-meta {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 12px;
			font-size: 0.85rem;
			color: var(--text-sub)
		}

		.article-meta span {
			display: flex;
			align-items: center;
			gap: 5px
		}

		.article-meta i {
			font-size: 0.8rem
		}

		.tag {
			background: rgba(99, 102, 241, 0.1);
			color: var(--primary-color);
			padding: 2px 8px;
			border-radius: 4px;
			font-size: 0.75rem;
			transition: all 0.2s ease
		}

		.tag:hover {
			background: var(--primary-color);
			color: #fff
		}

		/* ===== 分页样式 ===== */
		.pagination {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 8px;
			margin-top: 25px;
			padding: 15px 0;
			flex-wrap: wrap
		}

		.pagination .page-btn {
			min-width: 36px;
			height: 36px;
			padding: 0 12px;
			border: 1px solid var(--border-color);
			background: var(--card-bg);
			color: var(--text-main);
			border-radius: 6px;
			cursor: pointer;
			font-size: 0.9rem;
			transition: all 0.2s ease;
			display: flex;
			align-items: center;
			justify-content: center;
			text-decoration: none
		}

		.pagination .page-btn:hover:not(.active):not(:disabled) {
			border-color: var(--primary-color);
			color: var(--primary-color);
			background: rgba(99, 102, 241, 0.05)
		}

		.pagination .page-btn.active {
			background: var(--primary-color);
			color: #fff;
			border-color: var(--primary-color);
			font-weight: 500
		}

		.pagination .page-btn:disabled {
			opacity: 0.5;
			cursor: not-allowed
		}

		.pagination .page-ellipsis {
			color: var(--text-sub);
			padding: 0 4px
		}

		/* ===== 侧边栏小部件 ===== */
		.profile-card {
			cursor: pointer;
			position: relative;
			overflow: hidden;
			min-height: 280px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center
		}

		.avatar-container {
			position: relative;
			margin-bottom: 15px
		}

		.avatar {
			width: 90px;
			height: 90px;
			border-radius: 50%;
			background-color: #e0e7ff;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 2.2rem;
			color: var(--primary-color);
			border: 2px solid var(--border-color);
			box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
			transition: all 0.4s ease;
			animation: avatarFloat 3s ease-in-out infinite
		}

		[data-theme="dark"] .avatar {
			background-color: #374151
		}

		.avatar:hover {
			transform: scale(1.1) rotate(5deg);
			box-shadow: 0 0 45px rgba(99, 102, 241, 0.6);
			animation-play-state: paused
		}

		.avatar img {
			border-radius: 50%;
			border: rgba(99, 102, 241, 0.5) 2px solid
		}

		.name {
			font-size: 1.4rem;
			font-weight: bold;
			margin-bottom: 5px;
			color: var(--text-main)
		}

		.bio {
			font-size: 0.9rem;
			color: var(--text-sub);
			max-width: 80%
		}

		.social-links {
			margin-top: 15px;
			display: flex;
			justify-content: center;
			flex-wrap: wrap;
			gap: 10px
		}

		.social-links a {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 34px;
			height: 34px;
			border-radius: 50%;
			background-color: #f3f4f6;
			color: var(--text-sub);
			font-size: 1rem;
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			text-decoration: none
		}

		[data-theme="dark"] .social-links a {
			background-color: #374151
		}

		.social-links a:hover {
			background-color: var(--primary-color);
			color: #fff;
			transform: translateY(-3px)
		}

		.search-card {
			position: relative
		}

		.search-input {
			width: 100%;
			padding: 12px 40px 12px 15px;
			border: 1px solid var(--border-color);
			border-radius: 8px;
			background: var(--bg-color);
			color: var(--text-main);
			font-size: 0.95rem;
			font-family: inherit;
			transition: all 0.3s ease;
			box-sizing: border-box
		}

		.search-input:focus {
			outline: none;
			border-color: var(--primary-color);
			box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1)
		}

		.search-btn {
			position: absolute;
			right: 30px;
			top: 50%;
			transform: translateY(-50%);
			background: none;
			border: none;
			color: var(--text-sub);
			cursor: pointer;
			font-size: 1rem;
			transition: color 0.3s ease
		}

		.search-btn:hover {
			color: var(--primary-color)
		}

		.stats-card {
			text-align: center
		}

		.stats-grid {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 15px;
			margin-top: 15px
		}

		.stat-item {
			background: rgba(99, 102, 241, 0.05);
			padding: 15px 10px;
			border-radius: 8px;
			transition: all 0.3s ease
		}

		.stat-item:hover {
			background: rgba(99, 102, 241, 0.1);
			transform: translateY(-3px)
		}

		.stat-value {
			font-size: 1.5rem;
			font-weight: bold;
			color: var(--primary-color);
			margin-bottom: 5px
		}

		.stat-label {
			font-size: 0.85rem;
			color: var(--text-sub)
		}

		/* ===== 页脚 ===== */
		footer {
			background-color: var(--footer-bg);
			border-top: 1px solid var(--border-color);
			padding: 30px 20px;
			text-align: center;
			margin-top: 40px
		}

		.footer-line-1 {
			font-size: 0.9rem;
			color: var(--text-sub);
			margin-bottom: 10px
		}

		.footer-line-2 {
			font-size: 0.85rem;
			color: var(--text-sub);
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 15px;
			flex-wrap: wrap
		}

		.footer-line-2 a {
			color: var(--primary-color);
			text-decoration: none;
			transition: color 0.3s ease
		}

		.footer-line-2 a:hover {
			color: var(--primary-light);
			text-decoration: underline
		}

		/* ===== 动画 ===== */
		@keyframes fadeInUp {
			from {
				opacity: 0;
				transform: translateY(30px)
			}

			to {
				opacity: 1;
				transform: translateY(0)
			}
		}

		@keyframes fadeInRight {
			from {
				opacity: 0;
				transform: translateX(30px)
			}

			to {
				opacity: 1;
				transform: translateX(0)
			}
		}

		@keyframes slideDown {
			from {
				opacity: 0;
				transform: translateY(-20px)
			}

			to {
				opacity: 1;
				transform: translateY(0)
			}
		}

		@keyframes avatarFloat {

			0%,
			100% {
				transform: translateY(0)
			}

			50% {
				transform: translateY(-4px)
			}
		}

		@keyframes floatIcon {

			0%,
			100% {
				transform: translateY(0)
			}

			50% {
				transform: translateY(-5px)
			}
		}

		/* ===== 响应式 ===== */
		@media(max-width:768px) {
			.container {
				flex-direction: column
			}

			.sidebar,
			.main-content {
				flex: auto;
				width: 100%
			}

			.archive-header h1 {
				font-size: 1.6rem
			}

			.archive-stats {
				gap: 15px
			}

			.year-title {
				font-size: 1.3rem
			}

			.header-nav {
				display: none
			}
		}

		/* ===== 加载状态 ===== */
		.loading-container {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 60px 20px;
			color: var(--text-sub)
		}

		.loading-spinner {
			width: 50px;
			height: 50px;
			border: 3px solid var(--border-color);
			border-top-color: var(--primary-color);
			border-radius: 50%;
			animation: spin 1s linear infinite;
			margin-bottom: 15px
		}

		@keyframes spin {
			to {
				transform: rotate(360deg)
			}
		}

		.empty-state {
			text-align: center;
			padding: 60px 20px;
			color: var(--text-sub)
		}

		.empty-state i {
			font-size: 4rem;
			color: var(--border-color);
			margin-bottom: 20px
		}

		.empty-state p {
			font-size: 1.1rem
		}

		/* ===== 返回顶部 ===== */
		#backToTop {
			position: fixed;
			bottom: 30px;
			right: 30px;
			width: 50px;
			height: 50px;
			border-radius: 50%;
			background: var(--primary-color);
			color: #fff;
			border: none;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.2rem;
			box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
			opacity: 0;
			visibility: hidden;
			transform: translateY(20px);
			transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
			z-index: 999
		}

		#backToTop.show {
			opacity: 1;
			visibility: visible;
			transform: translateY(0)
		}

		#backToTop:hover {
			background: var(--primary-light);
			transform: translateY(-5px)
		}

		.profile-card {
			cursor: pointer;
			position: relative;
			overflow: hidden;
			min-height: 320px;
			display: flex;
			height: auto;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			touch-action: manipulation;
			-webkit-user-select: none
		}

		.profile-card:active {
			transform: scale(0.98)
		}

		.content-wrapper {
			position: relative;
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center
		}

		.profile-content,
		.site-intro-content {
			position: absolute;
			width: 100%;
			transition: all 0.3s ease-in-out;
			display: flex;
			flex-direction: column;
			align-items: center
		}

		.profile-content {
			opacity: 1;
			transform: translateX(0)
		}

		.site-intro-content {
			opacity: 0;
			transform: translateX(100%);
			pointer-events: none
		}

		.profile-card.active .profile-content {
			opacity: 0;
			transform: translateX(-100%);
			pointer-events: none
		}

		.profile-card.active .site-intro-content {
			opacity: 1;
			transform: translateX(0);
			pointer-events: auto
		}

		.avatar-container {
			position: relative;
			margin-bottom: 15px
		}

		.avatar {
			width: 100px;
			height: 100px;
			border-radius: 50%;
			background-color: #e0e7ff;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 2.5rem;
			color: var(--primary-color);
			border: 2px solid var(--border-color);
			box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
			transition: all 0.4s ease;
			animation: avatarFloat 3s ease-in-out infinite
		}

		[data-theme="dark"] .avatar {
			background-color: #374151
		}

		.avatar:hover {
			transform: scale(1.1) rotate(5deg);
			box-shadow: 0 0 45px rgba(99, 102, 241, 0.6);
			animation-play-state: paused
		}

		.avatar img {
			border-radius: 50%;
			border: rgba(99, 102, 241, 0.5) 2px solid
		}

		.name {
			font-size: 1.5rem;
			font-weight: bold;
			margin-bottom: 5px;
			color: var(--text-main);
			letter-spacing: 2px
		}

		.bio {
			font-size: 0.95rem;
			color: var(--text-sub);
			max-width: 80%
		}

		.intro-title {
			font-size: 1.4rem;
			color: var(--primary-color);
			margin-bottom: 10px;
			font-weight: bold;
			text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1)
		}

		.intro-text {
			font-size: 1rem;
			color: var(--text-sub);
			text-align: justify;
			padding: 0 10px;
			line-height: 1.8
		}

		.click-hint {
			margin-top: 20px;
			font-size: 0.8rem;
			color: var(--primary-color);
			opacity: 0.7;
			display: flex;
			align-items: center;
			gap: 5px;
			animation: pulseHint 2s infinite
		}

		@keyframes fadeInUp {
			from {
				opacity: 0;
				transform: translateY(30px)
			}

			to {
				opacity: 1;
				transform: translateY(0)
			}
		}

		@keyframes fadeInRight {
			from {
				opacity: 0;
				transform: translateX(30px)
			}

			to {
				opacity: 1;
				transform: translateX(0)
			}
		}

		@keyframes slideDown {
			from {
				opacity: 0;
				transform: translateY(-20px)
			}

			to {
				opacity: 1;
				transform: translateY(0)
			}
		}

		@keyframes avatarFloat {

			0%,
			100% {
				transform: translateY(0)
			}

			50% {
				transform: translateY(-4px)
			}
		}

		@keyframes pulseHint {

			0%,
			100% {
				opacity: 0.7;
				transform: scale(1)
			}

			50% {
				opacity: 1;
				transform: scale(1.05)
			}
		}

		@keyframes ringBell {

			0%,
			100% {
				transform: rotate(0)
			}

			10%,
			30%,
			50%,
			70%,
			90% {
				transform: rotate(-10deg)
			}

			20%,
			40%,
			60%,
			80% {
				transform: rotate(10deg)
			}
		}
	</style>
</head>
