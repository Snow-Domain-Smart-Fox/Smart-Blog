<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zym2013 的个人主页</title>
    <link rel="stylesheet" href="https://cdn.jsdmirror.cn/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet"
        href="https://cdn.jsdmirror.cn/gh/zym2013/amazing-luogu-international@main/style/markdown.css">
    <link rel="preload" href="https://cdn.jsdmirror.cn/npm/lxgw-wenkai-screen-webfont@1.7.0/style.min.css" as="style"
        crossorigin="anonymous" onload="this.rel='stylesheet'">
    <link rel="stylesheet" href="https://cdn.jsdmirror.cn/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        .main-content,
        .article-content {
            min-width: 0 !important;
            width: 100% !important;
            max-width: 100% !important;
            overflow-x: hidden !important;
            position: relative;
        }

        .code-container {
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box;
            margin: 1em 0;
            position: relative;
            overflow: hidden !important;
            border-radius: 6px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .code-container pre {
            margin: 0 !important;
            padding: 1em !important;
            display: block !important;
            overflow-x: auto !important;
            overflow-y: auto !important;
            white-space: pre !important;
            word-wrap: normal !important;
            word-break: normal !important;
            line-height: 1.5 !important;
            max-width: 100%;
            background: #fefefe;
            -webkit-overflow-scrolling: touch;
        }

        [data-theme="dark"] .code-container pre {
            background: #0d111730;
            color: #c9d1d9;
            transition: all 0.3s;
        }

        [data-theme="dark"] .code-container pre:hover {
            background: #0d1117 !important;
        }

        [data-theme="dark"] img:not(.avatar img) {
            opacity: 0.5;
            transition: all 0.3s;
        }

        [data-theme="dark"] img:not(.avatar img):hover {
            opacity: 1;
        }

        pre code.hljs {
            display: block;
            overflow-x: auto;
            padding: 1em
        }

        code.hljs {
            padding: 3px 5px
        }

        .hljs {
            color: #383a42;
            background: #fafafa
        }

        .hljs-comment,
        .hljs-quote {
            color: #a0a1a7;
            font-style: italic
        }

        .hljs-doctag,
        .hljs-formula,
        .hljs-keyword {
            color: #a626a4
        }

        .hljs-deletion,
        .hljs-name,
        .hljs-section,
        .hljs-selector-tag,
        .hljs-subst {
            color: #e45649
        }

        .hljs-literal {
            color: #0184bb
        }

        .hljs-addition,
        .hljs-attribute,
        .hljs-meta .hljs-string,
        .hljs-regexp,
        .hljs-string {
            color: #50a14f
        }

        .hljs-attr,
        .hljs-number,
        .hljs-selector-attr,
        .hljs-selector-class,
        .hljs-selector-pseudo,
        .hljs-template-variable,
        .hljs-type,
        .hljs-variable {
            color: #986801
        }

        .hljs-bullet,
        .hljs-link,
        .hljs-meta,
        .hljs-selector-id,
        .hljs-symbol,
        .hljs-title {
            color: #4078f2
        }

        .hljs-built_in,
        .hljs-class .hljs-title,
        .hljs-title.class_ {
            color: #c18401
        }

        .hljs-emphasis {
            font-style: italic
        }

        .hljs-strong {
            font-weight: 700
        }

        .hljs-link {
            text-decoration: underline
        }

        [data-theme="dark"] .hljs {
            color: #c9d1d9 !important;
            background: #0d111790 !important;
            padding: 1em !important;
            transition: all 0.3s;
        }

        [data-theme="dark"] .hljs:hover {
            background: #0d1117 !important;
        }

        [data-theme="dark"] .hljs-doctag,
        [data-theme="dark"] .hljs-keyword,
        [data-theme="dark"] .hljs-meta .hljs-keyword,
        [data-theme="dark"] .hljs-template-tag,
        [data-theme="dark"] .hljs-template-variable,
        [data-theme="dark"] .hljs-type,
        [data-theme="dark"] .hljs-variable.language_ {
            color: #ff7b72 !important
        }

        [data-theme="dark"] .hljs-title,
        [data-theme="dark"] .hljs-title.class_,
        [data-theme="dark"] .hljs-title.class_.inherited__,
        [data-theme="dark"] .hljs-title.function_ {
            color: #d2a8ff !important
        }

        [data-theme="dark"] .hljs-attr,
        [data-theme="dark"] .hljs-attribute,
        [data-theme="dark"] .hljs-literal,
        [data-theme="dark"] .hljs-meta,
        [data-theme="dark"] .hljs-number,
        [data-theme="dark"] .hljs-operator,
        [data-theme="dark"] .hljs-selector-attr,
        [data-theme="dark"] .hljs-selector-class,
        [data-theme="dark"] .hljs-selector-id,
        [data-theme="dark"] .hljs-variable {
            color: #79c0ff !important
        }

        [data-theme="dark"] .hljs-meta .hljs-string,
        [data-theme="dark"] .hljs-regexp,
        [data-theme="dark"] .hljs-string {
            color: #a5d6ff !important
        }

        [data-theme="dark"] hljs-built_in,
        [data-theme="dark"] .hljs-symbol {
            color: #ffa657 !important
        }

        [data-theme="dark"] .hljs-code,
        [data-theme="dark"] .hljs-comment,
        [data-theme="dark"] .hljs-formula {
            color: #8b949e !important
        }

        [data-theme="dark"] .hljs-name,
        [data-theme="dark"] .hljs-quote,
        [data-theme="dark"] .hljs-selector-pseudo,
        [data-theme="dark"] .hljs-selector-tag {
            color: #7ee787 !important
        }

        [data-theme="dark"] .hljs-subst {
            color: #c9d1d9 !important
        }

        [data-theme="dark"] .hljs-section {
            color: #1f6feb !important;
            font-weight: 700 !important
        }

        [data-theme="dark"] .hljs-bullet {
            color: #f2cc60 !important
        }

        [data-theme="dark"] .hljs-emphasis {
            color: #c9d1d9 !important;
            font-style: italic !important
        }

        [data-theme="dark"] .hljs-strong {
            color: #c9d1d9 !important;
            font-weight: 700 !important
        }

        [data-theme="dark"] .hljs-addition {
            color: #aff5b4 !important;
            background-color: #033a16 !important
        }

        [data-theme="dark"] .hljs-deletion {
            color: #ffdcd7 !important;
            background-color: #67060c !important
        }

        .code-container code {
            display: block;
            min-width: fit-content;
            width: max-content;
            font-family: "Fira Code", "Consolas", monospace;
            background: transparent;
            padding: 0;
            color: inherit;
        }

        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');

        :root {
            --primary-color: #6366f1;
            --primary-light: #818cf8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --footer-bg: #ffffffd0;
            --border-color: rgba(99, 102, 241, 0.1);
            --font-kai: "LXGW Wenkai Screen", "Kaiti SC", "STKaiti", "Noto Serif SC", serif;
            --shadow-color: rgba(0, 0, 0, 0.05);
            --shadow-hover: rgba(99, 102, 241, 0.15)
        }

        [data-theme="dark"] {
            --primary-color: #818cf8;
            --primary-light: #a5b4fc;
            --bg-color: #111827;
            --card-bg: #1f293790;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --footer-bg: #1f2937d0;
            --border-color: rgba(129, 140, 248, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.2);
            --shadow-hover: rgba(129, 140, 248, 0.2)
        }

        [data-theme="dark"] header {
            background: #111827d0 !important;
        }

        * {
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent
        }

        body {
            font-family: var(--font-kai), sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            min-height: 100vh
        }

        header {
            background-color: #ffffffd0;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 5%;
            box-shadow: 0 2px 4px var(--shadow-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(6px);
            animation: slideDown 0.8s ease-out;
            transition: background-color 0.3s ease, box-shadow 0.3s ease
        }

        header .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--primary-color);
            letter-spacing: 1px
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            display: flex;
            gap: 20px;
            padding: 0 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box
        }

        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px
        }

        .main-content {
            flex: 3
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px var(--shadow-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-color);
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards
        }

        .card:hover {
            box-shadow: 0 10px 20px var(--shadow-hover);
            transform: translateY(-5px);
            border-color: var(--primary-light)
        }

        .card:nth-child(1) {
            animation-delay: 0.1s
        }

        .card:nth-child(2) {
            animation-delay: 0.2s
        }

        .card:nth-child(3) {
            animation-delay: 0.3s
        }

        .profile-card {
            cursor: pointer;
            position: relative;
            overflow: hidden;
            min-height: 320px;
            display: flex;
            height: auto;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            touch-action: manipulation;
            -webkit-user-select: none
        }

        .profile-card:active {
            transform: scale(0.98)
        }

        .content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center
        }

        .profile-content,
        .site-intro-content {
            position: absolute;
            width: 100%;
            transition: all 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center
        }

        .profile-content {
            opacity: 1;
            transform: translateX(0)
        }

        .site-intro-content {
            opacity: 0;
            transform: translateX(100%);
            pointer-events: none
        }

        .profile-card.active .profile-content {
            opacity: 0;
            transform: translateX(-100%);
            pointer-events: none
        }

        .profile-card.active .site-intro-content {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto
        }

        .avatar-container {
            position: relative;
            margin-bottom: 15px
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #e0e7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--primary-color);
            border: 2px solid var(--border-color);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
            transition: all 0.4s ease;
            animation: avatarFloat 3s ease-in-out infinite
        }

        [data-theme="dark"] .avatar {
            background-color: #374151
        }

        .avatar:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 45px rgba(99, 102, 241, 0.6);
            animation-play-state: paused
        }

        .avatar img {
            border-radius: 50%;
            border: rgba(99, 102, 241, 0.5) 2px solid
        }

        .name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--text-main);
            letter-spacing: 2px
        }

        .bio {
            font-size: 0.95rem;
            color: var(--text-sub);
            max-width: 80%
        }

        .intro-title {
            font-size: 1.4rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1)
        }

        .intro-text {
            font-size: 1rem;
            color: var(--text-sub);
            text-align: justify;
            padding: 0 10px;
            line-height: 1.8
        }

        .click-hint {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--primary-color);
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 5px;
            animation: pulseHint 2s infinite
        }

        .hitokoto-card {
            text-align: center;
            padding: 30px 20px;
            position: relative;
            font-family: "Kaiti SC", "STKaiti", "Noto Serif SC", serif
        }

        .hitokoto-card::before {
            content: '\f10d';
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 2rem;
            color: rgba(99, 102, 241, 0.1)
        }

        .hitokoto-card::after {
            content: '\f10e';
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            bottom: 45px;
            right: 20px;
            font-size: 2rem;
            color: rgba(99, 102, 241, 0.1)
        }

        .hitokoto-text {
            font-size: 1.1rem;
            font-style: italic;
            margin-bottom: 10px;
            color: var(--text-main);
            position: relative;
            z-index: 1
        }

        .hitokoto-from {
            font-size: 0.9rem;
            color: var(--primary-color);
            font-weight: bold;
            text-align: right
        }

        .notice-card {
            border-left: 4px solid var(--primary-color);
            position: relative;
            overflow: hidden
        }

        .notice-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 50px;
            height: 100%;
            background: linear-gradient(to left, rgba(99, 102, 241, 0.05), transparent)
        }

        .notice-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: var(--primary-color);
            font-weight: bold
        }

        .notice-header i {
            animation: ringBell 2s infinite
        }

        .notice-content {
            font-size: 0.95rem;
            color: var(--text-sub)
        }

        .article-list {
            display: flex;
            flex-direction: column;
            gap: 15px
        }

        .article-item {
            background: var(--card-bg);
            padding: 14px 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            opacity: 0;
            animation: fadeInRight 0.6s ease-out forwards;
            position: relative;
            overflow: visible;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px var(--shadow-color)
        }

        .article-item:hover {
            box-shadow: 0 12px 18px var(--shadow-color);
            transform: translateY(-5px);
            border-color: var(--primary-light);
            border-left: 4px solid var(--primary-color)
        }

        .article-item:nth-child(1) {
            animation-delay: 0.4s
        }

        .article-item:nth-child(2) {
            animation-delay: 0.5s
        }

        .article-item:nth-child(3) {
            animation-delay: 0.6s
        }

        .article-item:nth-child(4) {
            animation-delay: 0.7s
        }

        .article-item:nth-child(5) {
            animation-delay: 0.8s
        }

        .article-item:nth-child(6) {
            animation-delay: 0.9s
        }

        .article-item:nth-child(7) {
            animation-delay: 1.0s
        }

        .article-item:nth-child(8) {
            animation-delay: 1.1s
        }

        .article-item:nth-child(9) {
            animation-delay: 1.2s
        }

        .article-item:nth-child(10) {
            animation-delay: 1.3s
        }

        .article-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
            line-height: 1.4
        }

        .article-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .article-info {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color)
        }

        .article-meta-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-sub)
        }

        .article-date,
        .article-category {
            display: flex;
            align-items: center;
            gap: 4px
        }

        .article-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        .tag {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: all 0.2s ease
        }

        .tag:hover {
            background: var(--primary-color);
            color: #fff
        }

        @media(max-width:480px) {
            .article-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px
            }

            .article-meta-left {
                width: 100%;
                justify-content: space-between
            }
        }

        .social-links {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            max-width: 200px
        }

        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #f3f4f6;
            color: var(--text-sub);
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            flex-shrink: 0
        }

        [data-theme="dark"] .social-links a {
            background-color: #374151
        }

        .social-links a:hover {
            background-color: var(--primary-color);
            color: #fff;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4)
        }

        @media(max-width:480px) {
            .social-links {
                gap: 10px;
                max-width: 200px
            }

            .social-links a {
                width: 32px;
                height: 32px;
                font-size: 1rem
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px)
            }

            to {
                opacity: 1;
                transform: translateX(0)
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes avatarFloat {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-4px)
            }
        }

        @keyframes pulseHint {

            0%,
            100% {
                opacity: 0.7;
                transform: scale(1)
            }

            50% {
                opacity: 1;
                transform: scale(1.05)
            }
        }

        @keyframes ringBell {

            0%,
            100% {
                transform: rotate(0)
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: rotate(-10deg)
            }

            20%,
            40%,
            60%,
            80% {
                transform: rotate(10deg)
            }
        }

        @media(max-width:768px) {
            .container {
                flex-direction: column
            }

            .sidebar,
            .main-content {
                flex: auto;
                width: 100%
            }

            .profile-card {
                min-height: 300px
            }
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
            margin-right: 5%
        }

        .nav-item {
            position: relative;
            cursor: pointer
        }

        .nav-link {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 500;
            padding: 8px 12px;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px
        }

        .nav-link:hover {
            color: var(--primary-color)
        }

        .nav-link i {
            font-size: 0.7rem;
            transition: transform 0.3s ease
        }

        .nav-item:hover .nav-link i {
            transform: rotate(180deg)
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 8px 0;
            min-width: 150px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-color);
            z-index: 1000
        }

        .nav-item:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0)
        }

        .dropdown-menu a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s ease
        }

        .dropdown-menu a:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-color);
            padding-left: 25px
        }

        .dropdown-menu a i {
            width: 16px;
            text-align: center
        }

        .theme-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-main);
            font-size: 1.2rem;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 10px
        }

        .theme-toggle-btn:hover {
            background-color: rgba(99, 102, 241, 0.1);
            color: var(--primary-color);
            transform: rotate(15deg)
        }

        .instant-post-banner {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease
        }

        .instant-post-banner:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4)
        }

        .banner-left {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 1.3rem;
            font-weight: bold;
            min-width: 120px
        }

        .banner-left i {
            font-size: 1.5rem;
            animation: featherFloat 2s ease-in-out infinite
        }

        .banner-middle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            flex: 1;
            text-align: center
        }

        .banner-right {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease
        }

        .banner-right:hover {
            background: #fff;
            color: var(--primary-color);
            transform: translateX(5px)
        }

        .banner-right i {
            transition: transform 0.3s ease
        }

        .banner-right:hover i {
            transform: translateX(3px)
        }

        #backToTop {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-color);
            color: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999
        }

        #backToTop.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0)
        }

        #backToTop:hover {
            background: var(--primary-light);
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6)
        }

        #backToTop:active {
            transform: scale(0.95)
        }

        @keyframes featherFloat {

            0%,
            100% {
                transform: translateY(0) rotate(0)
            }

            50% {
                transform: translateY(-5px) rotate(10deg)
            }
        }

        @media(max-width:768px) {
            .header-nav {
                display: none
            }

            .instant-post-banner {
                flex-direction: column;
                text-align: center;
                padding: 15px 20px
            }

            .banner-left {
                min-width: auto
            }

            .banner-middle {
                font-size: 0.9rem
            }

            #backToTop {
                bottom: 20px;
                right: 20px;
                width: 45px;
                height: 45px
            }
        }

        .greeting-text {
            font-size: 0.9rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-left: 15px;
            padding: 6px 12px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 20px;
            display: inline-block;
            animation: fadeInUp 0.8s ease-out
        }

        .greeting-text i {
            margin-right: 5px;
            font-size: 0.8rem
        }

        footer {
            background-color: var(--footer-bg);
            border-top: 1px solid var(--border-color);
            padding: 30px 20px;
            text-align: center;
            margin-top: 40px;
            transition: background-color 0.3s ease, border-color 0.3s ease
        }

        .footer-line-1 {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 10px;
            font-weight: 500
        }

        .footer-line-2 {
            font-size: 0.85rem;
            color: var(--text-sub);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap
        }

        .footer-line-2 a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.3s ease
        }

        .footer-line-2 a:hover {
            color: var(--primary-light);
            text-decoration: underline
        }

        #jinrishici-text {
            font-style: italic;
            border-right: 2px solid var(--primary-color);
            padding-right: 2px;
            animation: blinkCursor 0.8s infinite
        }

        @keyframes blinkCursor {

            0%,
            100% {
                border-color: var(--primary-color)
            }

            50% {
                border-color: transparent
            }
        }

        @media(max-width:768px) {
            .footer-line-2 {
                gap: 8px
            }
        }

        /* ===== 文章详情页样式 ===== */
        #articleView {
            display: none
        }

        .article-header {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color)
        }

        .article-header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 12px;
            line-height: 1.4;
            margin-top: 0px;
        }

        .article-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 0.9rem;
            color: var(--text-sub)
        }

        .article-meta span {
            display: flex;
            align-items: center;
            gap: 5px
        }

        .article-meta .tag {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-color);
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.85rem
        }

        .article-content {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-main)
        }

        @media(max-width:768px) {
            .article-header h1 {
                font-size: 1.5rem
            }

            .article-meta {
                gap: 10px;
                font-size: 0.85rem
            }

            .article-content {
                font-size: 1rem
            }

            .article-nav {
                flex-direction: column;
                gap: 15px
            }
        }

        #universe,
        #canvas_nest {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }

        /* ===== 分页样式 ===== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            padding: 15px 0;
            flex-wrap: wrap
        }

        .pagination .page-btn {
            min-width: 36px;
            height: 36px;
            padding: 0 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none
        }

        .pagination .page-btn:hover:not(.active):not(:disabled) {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(99, 102, 241, 0.05)
        }

        .pagination .page-btn.active {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            font-weight: 500
        }

        .pagination .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed
        }

        .pagination .page-ellipsis {
            color: var(--text-sub);
            padding: 0 4px
        }

        @media(max-width:480px) {
            .pagination {
                gap: 4px
            }

            .pagination .page-btn {
                min-width: 32px;
                height: 32px;
                padding: 0 8px;
                font-size: 0.85rem
            }
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-sub)
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }
    </style>
</head>
