<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>标签归档 - zym2013 的个人主页</title>
	<link rel="stylesheet" href="https://cdn.jsdmirror.cn/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
	<link rel="stylesheet"
		href="https://cdn.jsdmirror.cn/gh/zym2013/amazing-luogu-international@main/style/markdown.css">
	<link rel="preload" href="https://cdn.jsdmirror.cn/npm/lxgw-wenkai-screen-webfont@1.7.0/style.min.css" as="style"
		crossorigin="anonymous" onload="this.rel='stylesheet'">
	<link rel="stylesheet" href="https://cdn.jsdmirror.cn/npm/katex@0.16.9/dist/katex.min.css">
	<style>
		/* ===== 继承主站样式变量 ===== */
		:root {
			--primary-color: #6366f1;
			--primary-light: #818cf8;
			--bg-color: #f3f4f6;
			--card-bg: #ffffff;
			--text-main: #1f2937;
			--text-sub: #6b7280;
			--footer-bg: #ffffff;
			--border-color: rgba(99, 102, 241, 0.1);
			--font-kai: "LXGW Wenkai Screen", "Kaiti SC", "STKaiti", "Noto Serif SC", serif;
			--shadow-color: rgba(0, 0, 0, 0.05);
			--shadow-hover: rgba(99, 102, 241, 0.15)
		}

		[data-theme="dark"] {
			--primary-color: #818cf8;
			--primary-light: #a5b4fc;
			--bg-color: #111827;
			--card-bg: #1f2937;
			--text-main: #f9fafb;
			--text-sub: #9ca3af;
			--footer-bg: #1f2937;
			--border-color: rgba(129, 140, 248, 0.1);
			--shadow-color: rgba(0, 0, 0, 0.2);
			--shadow-hover: rgba(129, 140, 248, 0.2)
		}

		* {
			margin: 0;
			padding: 0;
			-webkit-tap-highlight-color: transparent
		}

		body {
			font-family: var(--font-kai), sans-serif;
			background-color: var(--bg-color);
			color: var(--text-main);
			line-height: 1.6;
			overflow-x: hidden;
			transition: background-color 0.3s ease, color 0.3s ease;
			display: flex;
			flex-direction: column;
			min-height: 100vh
		}

		/* ===== 头部导航（与主页一致）===== */
		header {
			background-color: var(--card-bg);
			height: 60px;
			display: flex;
			align-items: center;
			padding: 0 5%;
			box-shadow: 0 2px 4px var(--shadow-color);
			position: sticky;
			top: 0;
			z-index: 100;
			animation: slideDown 0.8s ease-out;
			transition: background-color 0.3s ease, box-shadow 0.3s ease
		}

		header .logo {
			font-weight: bold;
			font-size: 1.2rem;
			color: var(--primary-color);
			letter-spacing: 1px;
			text-decoration: none
		}

		.header-nav {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-left: auto;
			margin-right: 5%
		}

		.nav-item {
			position: relative;
			cursor: pointer
		}

		.nav-link {
			font-size: 1rem;
			color: var(--text-main);
			font-weight: 500;
			padding: 8px 12px;
			transition: color 0.3s ease;
			display: flex;
			align-items: center;
			gap: 5px;
			text-decoration: none
		}

		.nav-link:hover {
			color: var(--primary-color)
		}

		.nav-link i {
			font-size: 0.7rem;
			transition: transform 0.3s ease
		}

		.nav-item:hover .nav-link i {
			transform: rotate(180deg)
		}

		.dropdown-menu {
			position: absolute;
			top: 100%;
			left: 50%;
			transform: translateX(-50%) translateY(10px);
			background: var(--card-bg);
			border-radius: 8px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
			padding: 8px 0;
			min-width: 150px;
			opacity: 0;
			visibility: hidden;
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			border: 1px solid var(--border-color);
			z-index: 1000
		}

		.nav-item:hover .dropdown-menu {
			opacity: 1;
			visibility: visible;
			transform: translateX(-50%) translateY(0)
		}

		.dropdown-menu a {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 10px 20px;
			color: var(--text-main);
			text-decoration: none;
			font-size: 0.9rem;
			transition: all 0.2s ease
		}

		.dropdown-menu a:hover {
			background: rgba(99, 102, 241, 0.1);
			color: var(--primary-color);
			padding-left: 25px
		}

		.theme-toggle-btn {
			background: none;
			border: none;
			cursor: pointer;
			color: var(--text-main);
			font-size: 1.2rem;
			padding: 8px;
			border-radius: 50%;
			transition: all 0.3s ease;
			display: flex;
			align-items: center;
			justify-content: center;
			margin-left: 10px
		}

		.theme-toggle-btn:hover {
			background-color: rgba(99, 102, 241, 0.1);
			color: var(--primary-color);
			transform: rotate(15deg)
		}

		/* ===== 页面主体 ===== */
		.container {
			max-width: 1200px;
			margin: 20px auto;
			display: flex;
			gap: 20px;
			padding: 0 20px;
			flex: 1;
			width: 100%;
			box-sizing: border-box
		}

		.sidebar {
			flex: 1;
			display: flex;
			flex-direction: column;
			gap: 20px
		}

		.main-content {
			flex: 3;
			min-width: 0
		}

		.card {
			background: var(--card-bg);
			border-radius: 12px;
			padding: 20px;
			box-shadow: 0 4px 6px var(--shadow-color);
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			border: 1px solid var(--border-color);
			opacity: 0;
			animation: fadeInUp 0.8s ease-out forwards
		}

		.card:hover {
			box-shadow: 0 10px 20px var(--shadow-hover);
			transform: translateY(-5px);
			border-color: var(--primary-light)
		}

		/* ===== 标签页头部 ===== */
		.archive-header {
			background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
			border-radius: 12px;
			padding: 30px 25px;
			margin-bottom: 25px;
			box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
			opacity: 0;
			animation: fadeInUp 0.8s ease-out forwards;
			text-align: center;
			color: #fff
		}

		.archive-header h1 {
			font-size: 2rem;
			margin-bottom: 10px;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 12px;
			margin-top: 0px;
		}

		.archive-stats {
			display: flex;
			justify-content: center;
			gap: 30px;
			flex-wrap: wrap;
			font-size: 0.95rem;
			opacity: 0.9
		}

		.archive-stats span {
			display: flex;
			align-items: center;
			gap: 8px
		}

		/* ===== 标签云样式 ===== */
		.tags-container {
			display: flex;
			flex-wrap: wrap;
			gap: 15px;
			padding: 10px 0;
		}

		.tag-card {
			background: var(--card-bg);
			border: 1px solid var(--border-color);
			border-radius: 8px;
			padding: 12px 20px;
			display: flex;
			align-items: center;
			gap: 10px;
			cursor: pointer;
			transition: all 0.3s ease;
			text-decoration: none;
			color: var(--text-main);
			animation: fadeInUp 0.5s ease-out forwards;
			opacity: 0;
		}

		.tag-card:hover {
			border-color: var(--primary-color);
			box-shadow: 0 5px 15px var(--shadow-hover);
			transform: translateY(-3px);
			color: var(--primary-color);
		}

		.tag-card .tag-name {
			font-weight: 600;
			font-size: 1rem;
		}

		.tag-card .tag-count {
			background: rgba(99, 102, 241, 0.1);
			color: var(--primary-color);
			padding: 2px 8px;
			border-radius: 12px;
			font-size: 0.75rem;
			font-weight: bold;
		}

		/* ===== 侧边栏小部件 ===== */
		.profile-card {
			cursor: pointer;
			position: relative;
			overflow: hidden;
			min-height: 320px;
			display: flex;
			height: auto;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			touch-action: manipulation;
			-webkit-user-select: none
		}

		.profile-card:active {
			transform: scale(0.98)
		}

		.content-wrapper {
			position: relative;
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center
		}

		.profile-content,
		.site-intro-content {
			position: absolute;
			width: 100%;
			transition: all 0.3s ease-in-out;
			display: flex;
			flex-direction: column;
			align-items: center
		}

		.profile-content {
			opacity: 1;
			transform: translateX(0)
		}

		.site-intro-content {
			opacity: 0;
			transform: translateX(100%);
			pointer-events: none
		}

		.profile-card.active .profile-content {
			opacity: 0;
			transform: translateX(-100%);
			pointer-events: none
		}

		.profile-card.active .site-intro-content {
			opacity: 1;
			transform: translateX(0);
			pointer-events: auto
		}

		.avatar-container {
			position: relative;
			margin-bottom: 15px
		}

		.avatar {
			width: 100px;
			height: 100px;
			border-radius: 50%;
			background-color: #e0e7ff;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 2.5rem;
			color: var(--primary-color);
			border: 2px solid var(--border-color);
			box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
			transition: all 0.4s ease;
			animation: avatarFloat 3s ease-in-out infinite
		}

		[data-theme="dark"] .avatar {
			background-color: #374151
		}

		.avatar:hover {
			transform: scale(1.1) rotate(5deg);
			box-shadow: 0 0 45px rgba(99, 102, 241, 0.6);
			animation-play-state: paused
		}

		.avatar img {
			border-radius: 50%;
			border: rgba(99, 102, 241, 0.5) 2px solid
		}

		.name {
			font-size: 1.5rem;
			font-weight: bold;
			margin-bottom: 5px;
			color: var(--text-main);
			letter-spacing: 2px
		}

		.bio {
			font-size: 0.95rem;
			color: var(--text-sub);
			max-width: 80%
		}

		.intro-title {
			font-size: 1.4rem;
			color: var(--primary-color);
			margin-bottom: 10px;
			font-weight: bold;
			text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1)
		}

		.intro-text {
			font-size: 1rem;
			color: var(--text-sub);
			text-align: justify;
			padding: 0 10px;
			line-height: 1.8
		}

		.click-hint {
			margin-top: 20px;
			font-size: 0.8rem;
			color: var(--primary-color);
			opacity: 0.7;
			display: flex;
			align-items: center;
			gap: 5px;
			animation: pulseHint 2s infinite
		}

		.search-card {
			position: relative
		}

		.search-input {
			width: 100%;
			padding: 12px 40px 12px 15px;
			border: 1px solid var(--border-color);
			border-radius: 8px;
			background: var(--bg-color);
			color: var(--text-main);
			font-size: 0.95rem;
			font-family: inherit;
			transition: all 0.3s ease;
			box-sizing: border-box
		}

		.search-input:focus {
			outline: none;
			border-color: var(--primary-color);
			box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1)
		}

		.search-btn {
			position: absolute;
			right: 30px;
			top: 50%;
			transform: translateY(-50%);
			background: none;
			border: none;
			color: var(--text-sub);
			cursor: pointer;
			font-size: 1rem;
			transition: color 0.3s ease
		}

		.search-btn:hover {
			color: var(--primary-color)
		}

		.stats-card {
			text-align: center
		}

		.stats-grid {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 15px;
			margin-top: 15px
		}

		.stat-item {
			background: rgba(99, 102, 241, 0.05);
			padding: 15px 10px;
			border-radius: 8px;
			transition: all 0.3s ease
		}

		.stat-item:hover {
			background: rgba(99, 102, 241, 0.1);
			transform: translateY(-3px)
		}

		.stat-value {
			font-size: 1.5rem;
			font-weight: bold;
			color: var(--primary-color);
			margin-bottom: 5px
		}

		.stat-label {
			font-size: 0.85rem;
			color: var(--text-sub)
		}

		/* ===== 页脚 ===== */
		footer {
			background-color: var(--footer-bg);
			border-top: 1px solid var(--border-color);
			padding: 30px 20px;
			text-align: center;
			margin-top: 40px
		}

		.footer-line-1 {
			font-size: 0.9rem;
			color: var(--text-sub);
			margin-bottom: 10px
		}

		.footer-line-2 {
			font-size: 0.85rem;
			color: var(--text-sub);
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 15px;
			flex-wrap: wrap
		}

		.footer-line-2 a {
			color: var(--primary-color);
			text-decoration: none;
			transition: color 0.3s ease
		}

		.footer-line-2 a:hover {
			color: var(--primary-light);
			text-decoration: underline
		}

		/* ===== 动画 ===== */
		@keyframes fadeInUp {
			from {
				opacity: 0;
				transform: translateY(30px)
			}

			to {
				opacity: 1;
				transform: translateY(0)
			}
		}

		@keyframes slideDown {
			from {
				opacity: 0;
				transform: translateY(-20px)
			}

			to {
				opacity: 1;
				transform: translateY(0)
			}
		}

		@keyframes avatarFloat {

			0%,
			100% {
				transform: translateY(0)
			}

			50% {
				transform: translateY(-4px)
			}
		}

		@keyframes pulseHint {

			0%,
			100% {
				opacity: 0.7;
				transform: scale(1)
			}

			50% {
				opacity: 1;
				transform: scale(1.05)
			}
		}

		/* ===== 响应式 ===== */
		@media(max-width:768px) {
			.container {
				flex-direction: column
			}

			.sidebar,
			.main-content {
				flex: auto;
				width: 100%
			}

			.archive-header h1 {
				font-size: 1.6rem
			}

			.archive-stats {
				gap: 15px
			}

			.header-nav {
				display: none
			}
		}

		/* ===== 加载状态 ===== */
		.loading-container {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 60px 20px;
			color: var(--text-sub)
		}

		.loading-spinner {
			width: 50px;
			height: 50px;
			border: 3px solid var(--border-color);
			border-top-color: var(--primary-color);
			border-radius: 50%;
			animation: spin 1s linear infinite;
			margin-bottom: 15px
		}

		@keyframes spin {
			to {
				transform: rotate(360deg)
			}
		}

		.empty-state {
			text-align: center;
			padding: 60px 20px;
			color: var(--text-sub)
		}

		.empty-state i {
			font-size: 4rem;
			color: var(--border-color);
			margin-bottom: 20px
		}

		.empty-state p {
			font-size: 1.1rem
		}

		/* ===== 返回顶部 ===== */
		#backToTop {
			position: fixed;
			bottom: 30px;
			right: 30px;
			width: 50px;
			height: 50px;
			border-radius: 50%;
			background: var(--primary-color);
			color: #fff;
			border: none;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.2rem;
			box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
			opacity: 0;
			visibility: hidden;
			transform: translateY(20px);
			transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
			z-index: 999
		}

		#backToTop.show {
			opacity: 1;
			visibility: visible;
			transform: translateY(0)
		}

		#backToTop:hover {
			background: var(--primary-light);
			transform: translateY(-5px)
		}

		.greeting-text {
            font-size: 0.9rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-left: 15px;
            padding: 6px 12px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 20px;
            display: inline-block;
            animation: fadeInUp 0.8s ease-out
        }

        .greeting-text i {
            margin-right: 5px;
            font-size: 0.8rem
        }

		.social-links {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            max-width: 200px
        }

        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #f3f4f6;
            color: var(--text-sub);
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            flex-shrink: 0
        }

        [data-theme="dark"] .social-links a {
            background-color: #374151
        }

        .social-links a:hover {
            background-color: var(--primary-color);
            color: #fff;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4)
        }

        @media(max-width:480px) {
            .social-links {
                gap: 10px;
                max-width: 200px
            }

            .social-links a {
                width: 32px;
                height: 32px;
                font-size: 1rem
            }
        }
	</style>
</head>

<body>
	<script src="https://cdn.jsdmirror.cn/npm/@supabase/supabase-js@2.97.0/dist/umd/supabase.min.js"></script>
	<script>
		document.write(`<header>

				<div class="dropdown-menu">

					</a>

			<button id="themeToggle" class="theme-toggle-btn" title="切换主题模式">
				<i class="fa-solid fa-desktop"></i>
			</button>
		</nav>
	</header>
	<button id="backToTop" title="返回顶部"><i class="fas fa-arrow-up"></i></button>
	<div class="container">
		<aside class="sidebar">
			<div class="card profile-card" id="profileCard" role="button" tabindex="0">
				<div class="content-wrapper">
					<div class="profile-content">
						<div class="avatar-container">
							<div class="avatar"><img src="https://cdn.luogu.com.cn/upload/usericon/1393230.png" /></div>
						</div>
						<div class="name">zym2013</div>

		async function fetchAllArticles() {
			const { data, error, count } = await Supabase
				.from('articles')
				.select('*', { count: 'exact' })
				.eq('published', true)
				.order('created_at', { ascending: false });
			if (error) {
				console.error('Fetch articles error:', error);
				return { articles: [], total: 0 };
			}
			return { articles: data || [], total: count || 0 };
		}

		// ===== 提取并统计标签 =====
		function extractTags(articles) {
			const tagMap = {};
			articles.forEach(article => {
				if (article.tags && Array.isArray(article.tags)) {
					article.tags.forEach(tag => {
						if (!tagMap[tag]) {
							tagMap[tag] = 0;
						}
						tagMap[tag]++;
					});
				}
			});
			// 转换为数组并排序
			return Object.entries(tagMap)
				.map(([name, count]) => ({ name, count }))
				.sort((a, b) => b.count - a.count); // 按数量降序
		}

			updateStats(stats);
		}

		// ===== 更新统计信息 =====
		function updateStats({ totalArticles, totalTags, totalCategories, totalYears }) {
			document.getElementById('totalArticles').textContent = totalArticles;
			document.getElementById('totalTags').textContent = totalTags;
			document.getElementById('totalCategories').textContent = totalCategories;
			document.getElementById('totalYears').textContent = totalYears;
		}

		// ===== 工具函数 =====
		function escapeHtml(text) {
			if (!text) return text;
			return text.replace(/&/g, '&amp;').replace(/</g, '&lt;')
				.replace(/>/g, '&gt;').replace(/"/g, '&quot;')
				.replace(/'/g, '&#039;');
		}

		// ===== 运行时间 =====
		function updateRuntime() {
			const start = new Date('2023-01-01T00:00:00');
			const now = new Date();
			const diff = now - start;
			const y = Math.floor(diff / (1e3 * 60 * 60 * 24 * 365));
			const d = Math.floor((diff % (1e3 * 60 * 60 * 24 * 365)) / (1e3 * 60 * 60 * 24));
			const h = Math.floor((diff % (1e3 * 60 * 60 * 24)) / (1e3 * 60 * 60));
			const m = Math.floor((diff % (1e3 * 60 * 60)) / (1e3 * 60));
			const s = Math.floor((diff % (1e3 * 60)) / 1e3);
			const el = document.getElementById('website-runtime');
			if (el) el.textContent = `${y}年 ${d}天 ${h}时 ${m}分 ${s}秒`;
		}
		let jrTimer = null,
			jrText = "",
			jrIndex = 0,
			isDel = false,
			hasFetch = false;
		function runTypewriter() {
			const el = document.getElementById('jinrishici-text');
			if (!el) return;
			const TS = 150,
				DS = 75,
				PT = 1500;
			if (!jrText && !hasFetch) {
				hasFetch = true;
				fetch('https://v1.jinrishici.com/all.json').then(r => r.json()).then(d => {
					jrText = (d && d.content) ? d.content : "人生得意须尽欢";
					setTimeout(runTypewriter, 500)
				}).catch(() => {
					jrText = "加载诗词失败";
					setTimeout(runTypewriter, 500)
				});
				return
			}
			if (!jrText && hasFetch) {
				fetch('https://v1.jinrishici.com/all.json').then(r => r.json()).then(d => {
					jrText = (d && d.content) ? d.content : "人生得意须尽欢";
					isDel = false;
					jrIndex = 0;
					setTimeout(runTypewriter, 500)
				}).catch(() => {
					jrText = "加载诗词失败";
					isDel = false;
					jrIndex = 0;
					setTimeout(runTypewriter, 500)
				});
				return
			}
			if (isDel) {
				el.textContent = jrText.substring(0, jrIndex - 1);
				jrIndex--;
				if (jrIndex === 0) {
					jrText = "";
					setTimeout(runTypewriter, PT)
				} else jrTimer = setTimeout(runTypewriter, DS)
			} else {
				el.textContent = jrText.substring(0, jrIndex + 1);
				jrIndex++;
				if (jrIndex === jrText.length) {
					setTimeout(() => {
						isDel = true;
						runTypewriter()
					}, PT)
				} else jrTimer = setTimeout(runTypewriter, TS)
			}
		}

		// ===== 返回顶部 =====
		const backToTopBtn = document.getElementById('backToTop');
		if (backToTopBtn) {
			window.addEventListener('scroll', () => {
				if (window.scrollY > 300) {
					backToTopBtn.classList.add('show');
				} else {
					backToTopBtn.classList.remove('show');
				}
			});
			backToTopBtn.addEventListener('click', () => {
				window.scrollTo({ top: 0, behavior: 'smooth' });
			});
		}

		// ===== 加载标签页 =====
		async function loadTags() {
			const container = document.getElementById('tagsContent');
			container.innerHTML = `
<div class="loading-container">
<div class="loading-spinner"></div>
<p>正在加载标签数据...</p>
</div>
`;
			const { articles } = await fetchAllArticles();
			const tags = extractTags(articles);

			// 计算统计数据
			const years = new Set(articles.map(a => new Date(a.created_at).getFullYear()));
			const categories = new Set(articles.map(a => a.category).filter(c => c));
			const allTags = new Set();
			articles.forEach(a => {
				if (a.tags) a.tags.forEach(t => allTags.add(t));
			});

			const stats = {
				totalArticles: articles.length,
				totalTags: allTags.size,
				totalCategories: categories.size,
				totalYears: years.size
			};

			renderTags(tags, stats);
		}

		// ===== 初始化 =====
		document.addEventListener('DOMContentLoaded', async () => {
			initTheme();
			updateRuntime();
			setInterval(updateRuntime, 1000);
			updateGreeting();
			runTypewriter();
			// 这里省略 typewriter 扩展代码，保留容器
			const url = new URL(location.href);
			await loadTags();
		});
	</script>
</body>
